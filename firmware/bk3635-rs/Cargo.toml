[package]
name = "slimblade-firmware"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["rlib"]

[profile.dev]
panic = "abort"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = false

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
warnings = "deny"

[lints.clippy]
dbg_macro = "deny"
float_arithmetic = "deny"
integer_division = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
