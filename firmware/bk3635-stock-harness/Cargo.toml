[package]
name = "slimblade-stock-harness"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[[bin]]
name = "slimblade-stock-harness"
path = "src/main.rs"

[[bin]]
name = "slimblade-late-marker-probe"
path = "src/late_marker.rs"

[[bin]]
name = "slimblade-experiment-entry-probe"
path = "src/experiment_entry.rs"

[[bin]]
name = "slimblade-rust-response-probe"
path = "src/rust_response.rs"

[[bin]]
name = "slimblade-post-init-hook-probe"
path = "src/post_init_hook.rs"

[[bin]]
name = "slimblade-wired-loop-hook-probe"
path = "src/wired_loop_hook.rs"

[[bin]]
name = "slimblade-active-loop-hook-probe"
path = "src/active_loop_hook.rs"

[[bin]]
name = "slimblade-steady-loop-hook-probe"
path = "src/steady_loop_hook.rs"

[[bin]]
name = "slimblade-dispatcher-return-hook-probe"
path = "src/dispatcher_return_hook.rs"

[[bin]]
name = "slimblade-experiment-dispatch-guard"
path = "src/experiment_dispatch_guard.rs"

[[bin]]
name = "slimblade-input-diagnostics"
path = "src/input_diagnostics.rs"

[[bin]]
name = "slimblade-paged-input-diagnostics"
path = "src/paged_input_diagnostics.rs"

[profile.dev]
panic = "abort"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = false

[lints.rust]
unsafe_code = "warn"
warnings = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
allow_attributes_without_reason = "warn"
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"
